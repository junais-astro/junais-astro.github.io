name: update-publications

# Pulls the publication list from the ADS public library into
# _bibliography/papers.bib and rebuilds the site when something changed.
on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:                    # also when you change the per-paper tweaks
    branches: [master]
    paths:
      - _bibliography/extra_fields.yml
      - bin/update_publications.py

permissions:
  contents: write   # commit papers.bib
  actions: write    # start the deploy workflow

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications from ADS
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: |
          pip install --quiet pyyaml
          python bin/update_publications.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- _bibliography/papers.bib; then
            echo "No new publications."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git commit -m "Update publications from ADS"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made by this workflow do not trigger other workflows,
      # so start the site build explicitly.
      - name: Rebuild site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
