# Line breaks inside a paragraph are ignored on the site; leave an EMPTY line to start a new paragraph.
about: |
  My research primarily focuses on the study of Low Surface Brightness galaxies (LSBs),
  particularly giant LSBs, ultra-diffuse galaxies, and dwarf galaxies. I use
  observations from UV and optical deep photometry (e.g., GALEX, CFHT, HSC), as well as
  spectroscopy and integral-field-unit (IFU) observations (e.g., VLT/MUSE), to
  investigate the properties of LSBs and dwarf galaxies. My interests are in
  understanding the formation of these galaxies (which is still debated!), the role of
  the environment in their evolution, and the mechanisms of star formation in
  low-density regimes. I am also interested in exploring their metallicity, dust, and
  gas properties using multi-wavelength spectral energy distribution (SED) fitting
  methods. Additionally, I use machine learning techniques to identify low surface
  brightness and dwarf galaxies from large sky surveys. This is particularly important
  in the context of the vast discovery space opened by Euclid and LSST observations. I
  am also an active member of the Euclid and LSST collaborations. Currently, I am an
  Alexander von Humboldt Postdoctoral Fellow at the Leibniz Institute for Astrophysics
  Potsdam (AIP), where I work on dwarf galaxies using deep imaging and IFU observations.

